  :root{
    /* Single-theme by intent: this is a printed invitation, not a UI. */
    --paper:        #f1efe8;
    --paper-hi:     #fbfaf6;
    --paper-lo:     #e2ded2;
    /* The envelope, which was the card's own three tones exactly. Same stock and
       the same light, taken down about 5% across all three stops — enough that
       what comes out of the pocket reads as lighter than what it came out of,
       and not so much that the two stop being the same paper. */
    --env:          #e5e2da;
    --env-hi:       #eeece7;
    --env-lo:       #d6d2c5;
    --deboss-dark:  rgba(118,107,84,.34);
    --deboss-light: rgba(255,255,255,.92);
    --relief:       #bdb5a3;
    --relief-deep:  #a79e89;
    --ink:          #5e574a;
    --foil:         #c9a227;
    --hint:         #9d9682;
    --edge:         rgba(93,84,62,.16);
    /* the wax, shared: the hint underneath it is placed off the seal's own size
       rather than off the bottom of the window, so the two stay together */
    --seal:         min(23vw, 108px);
    --ease:         cubic-bezier(.16,.84,.24,1);
    /* Slower out of the gate and much longer in the tail than --ease, which is
       tuned for interface moves. Paper has mass; it should not snap. */
    --ease-paper:   cubic-bezier(.32,.06,.16,1);
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% 0%, #e9e5da 0%, #dbd6c8 60%, #cfc9b9 100%);
    color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(14px,2.6vh,26px);
    padding:clamp(16px,3vh,34px) 16px;
    min-height:100%;
    min-height:100dvh;          /* phones: the small-viewport unit, not 100vh */
    position:relative;
    overflow-x:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- the card ---------- */

  /* Two sizes, and which one is in force says what the page is for.
     Unscratched there is nothing under the card but one line of hint, so the
     card is as large as the window allows and the reserve below it is that
     line. Revealed, the calendar button needs somewhere to be, and it is given
     the room by the card — which comes down a step and, because the column is
     centred, rises as it goes. The card is smaller at the moment it stops being
     the only thing on the page, which is the right way round.

     Real width, not a transform: the heart is a canvas rasterised at the card's
     layout size, and scaling the card would hand back a soft, upscaled heart —
     the one thing `resizeFoil` is written to avoid. */
  .card{
    container-type:inline-size;
    display:grid;               /* one in-flow child: the stack, centred in the sheet */
    position:relative;
    /* 100% is the padded body box, so the card can never overflow sideways */
    width:min(100%, calc((100dvh - 139px) / 1.52), 480px);
    aspect-ratio:1 / 1.52;
    background:
      linear-gradient(158deg, var(--paper-hi) 0%, var(--paper) 46%, var(--paper-lo) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 -1px 0 rgba(120,110,88,.10) inset,
      0 1px 2px rgba(70,62,44,.14),
      0 10px 26px -8px rgba(70,62,44,.30),
      0 34px 60px -30px rgba(70,62,44,.42);
    border:1px solid var(--edge);
    overflow:hidden;
    isolation:isolate;
    animation:settle .9s var(--ease) both;
    /* Starts on the same second as the button below, because they are one move:
       the card steps back as the button arrives, not before it. It does not end
       on the same second. --ease is tuned for interface moves and .62s of it on
       something this size reads as a zoom, which is a camera doing something to
       the card rather than the card doing something; the sheet takes 1.6s of
       --ease-paper instead, and is still settling as the button lands. */
    transition:width 1.6s var(--ease-paper) 1s;
  }
  .card.revealed{
    width:min(100%, calc((100dvh - 209px) / 1.52), 460px);
  }

  @keyframes settle{
    from{ opacity:0; transform:translateY(14px) scale(.985); }
    to  { opacity:1; transform:none; }
  }

  /* The stock, and now the only thing dressing the sheet. Two frequencies, not
     one: the fine layer is the tooth of the sheet, and the slow layer is the
     cloud left where the pulp settled unevenly in the mould. A single
     high-frequency noise reads as screen grain — it is the low one that says
     paper, because nothing manufactured flat has patches.

     The tooth is a photograph of cold-press paper rather than turbulence, which
     is the one thing procedural noise cannot fake: the grain of real stock is
     directional and clumped where noise is evenly random. Two things were done
     to the photograph to make it usable. Its own lighting — a slow gradient and
     a soft vignette, i.e. the room it was shot in — was subtracted and the rest
     hung off white, so under multiply it darkens only where the tooth is and the
     sheet's colour still comes from the gradient underneath. Then it was
     mirrored into a 2x2 block, which is what lets a photograph tile at all: the
     pixels that meet across a repeat are the same pixels.

     Same stock for the envelope and the card inside it, so the whole thing is
     cut from one sheet. The tiles are laid from each panel's own top-left, and
     for the three envelope panels that is the same corner of the window, so the
     grain runs straight through the seams the way the gradient does. */
  .stock::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      url("paper.jpg"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='0.011' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='520' height='520' filter='url(%23m)' opacity='0.30'/></svg>");
    background-size:600px auto, 520px 520px;
    mix-blend-mode:multiply;
    opacity:.55;
    pointer-events:none;
    z-index:1;
  }

  /* Gold florals at two opposite corners, cropped out of the source frame and
     placed on the diagonal the art was drawn on. Set into the corners rather
     than floated near them: the art runs to the edge of its own bitmap on all
     four sides, so any offset at all is a gap between the ornament and the trim,
     and a gap is what made them read as stickers laid on the sheet.

     Every value is in cqw, against the card's own inline size, so the ornament
     holds its proportion from a 320px phone to the 480px cap. The widths are the
     two numbers worth tuning by eye — they are what keeps the flowers clear of
     the script names on the right and the colophon on the left. */
  .corner{
    position:absolute;
    width:var(--w);
    background-size:100% 100%;
    background-repeat:no-repeat;
    pointer-events:none;
    /* under the fibre layer and the vignette, so the grain multiplies over the
       gold and the light crosses it: printed into the stock, not stuck on it */
    z-index:0;
  }
  .corner-tr{
    --w:34cqw;
    top:0;
    right:0;
    aspect-ratio:448 / 598;
    background-image:url("corner-tr.png");
  }
  .corner-bl{
    --w:40cqw;
    bottom:0;
    left:0;
    aspect-ratio:448 / 466;
    background-image:url("corner-bl.png");
  }

  /* light falling across the sheet */
  .vignette{
    position:absolute; inset:0;
    background:
      radial-gradient(78% 58% at 50% 34%, rgba(255,255,255,.42), rgba(255,255,255,0) 70%),
      radial-gradient(120% 100% at 50% 108%, rgba(104,94,70,.16), rgba(104,94,70,0) 62%);
    pointer-events:none;
    z-index:2;
  }

  /* Capped, not stretched. When the sheet goes full-screen on a phone it is far
     taller than the card it replaces, and letting the setting stretch with it
     would pull the names, the heart and the colophon apart until they stopped
     reading as one composition. The cap is the card's own proportion, so this
     changes nothing on desktop, where the sheet is already that shape. */
  .stack{
    position:relative;
    z-index:3;
    height:min(100%, 168cqw);
    align-self:center;
    display:grid;
    grid-template-rows:1fr auto 1fr;
    align-items:center;
    /* The margin the lace used to occupy, kept after it was taken away. Every
       size below is measured against the 74cqw this leaves, and giving it back
       would mean re-tuning all of them for nothing — an invitation is mostly
       margin anyway. */
    padding:13cqw;
    text-align:center;
  }

  /* ---------- letterpress type ---------- */

  .deboss{
    color:var(--relief);
    text-shadow:
      0 1px 0 var(--deboss-light),
      0 -1px 1px var(--deboss-dark);
  }

  /* Now the subordinate line under the rule, not the headline — sized down and
     tracked slightly so it reads as the colophon it has become. */
  /* Darker than the .deboss default it used to take. Small type debossed into
     paper loses contrast the script above it does not — the names are 10.6cqw of
     stroke and can carry --relief, this is 5.6cqw of it and could not. */
  .eyebrow{
    margin:0;
    color:#9a917f;
    font-size:5.6cqw;
    font-weight:400;
    line-height:1;
    letter-spacing:.05em;
    text-wrap:balance;
  }
  .eyebrow i{ font-style:italic; letter-spacing:0; }

  .colophon{
    align-self:start;
    padding-top:5.4cqw;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4cqw;
  }

  /* hairline + lozenge: the only ornament on the sheet */
  .rule{
    display:flex;
    align-items:center;
    gap:2.6cqw;
    width:40cqw;
    color:rgba(150,140,116,.5);
  }
  .rule span{
    flex:1;
    height:1px;
    background:currentColor;
    box-shadow:0 1px 0 rgba(255,255,255,.8);
  }
  .rule b{
    width:3.1cqw; height:3.1cqw;
    border:1px solid currentColor;
    transform:rotate(45deg);
    box-shadow:0 1px 0 rgba(255,255,255,.75);
  }

  /* The headline now. Script wants tight tracking and a large size — the
     tracked-out small caps that suited the old setting would pull the joins
     apart. Sits on the baseline of the top row, breathing above the heart. */
  .names{
    margin:0;
    align-self:end;
    padding-bottom:5cqw;
    font-family:'Pinyon Script','Snell Roundhand','Edwardian Script ITC',cursive;
    /* the largest that still sets on one line inside the margin — any bigger
       and the ampersand orphans onto a second line */
    font-size:10.6cqw;
    font-weight:400;
    line-height:1.16;
    white-space:nowrap;
    letter-spacing:.012em;
    color:var(--relief-deep);
    text-shadow:
      0 1px 0 var(--deboss-light),
      0 -1px 1px var(--deboss-dark);
  }

  /* ---------- heart zone ---------- */

  .heart{
    position:relative;
    width:66cqw;
    aspect-ratio:1 / .94;
    margin:0 auto;
    display:grid;
    place-items:center;
    /* a drag across the foil is a scratch, not a text selection, and a long
       press on it is not a request for the iOS callout menu */
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  /* the pressed heart the foil sat in — surfaces as the foil goes */
  .imprint{
    position:absolute; inset:0;
    width:100%; height:100%;
    opacity:0;
    transition:opacity .5s var(--ease) .08s;
    pointer-events:none;
    z-index:1;
  }
  .revealed .imprint{ opacity:1; }

  /* one warm breath of light at the moment of reveal */
  .bloom{
    position:absolute;
    inset:-42%;
    background:radial-gradient(closest-side, rgba(224,190,96,.5), rgba(224,190,96,0) 72%);
    opacity:0;
    pointer-events:none;
    z-index:1;
  }
  .revealed .bloom{ animation:breathe 1.15s var(--ease) forwards; }
  @keyframes breathe{
    0%   { opacity:0;   transform:scale(.72); }
    26%  { opacity:.95; transform:scale(1);   }
    100% { opacity:0;   transform:scale(1.16);}
  }

  /* Optically centred, not geometrically. A heart carries its mass in the two
     lobes up top and tapers to a point, so its centroid sits above the middle
     of its box — text centred in the box reads noticeably low against it. */
  /* The clip layer, and nothing else. Untransformed, so the path stays exactly
     where the plate's own silhouette is.

     The clip is the reason the message can simply be visible: the silhouette
     narrows at the foot and the date does not wrap, so on a narrow enough screen
     it would reach past the outline and give the answer away before a finger
     touched it — which is why this used to be hidden outright. Clipped to the
     plate's path, nothing can sit outside the gold that is covering it. */
  .secret{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    /* was 15cqw, which was set around type a size smaller than this; the date is
       nowrap and would have run out under the lobes */
    padding:0 12cqw;
    clip-path:url(#heart-clip);
    z-index:2;
  }

  /* Optically centred, in cqw against the card rather than in per cent against
     the box, so the lift is a fixed fraction of the sheet and not of whatever
     the text happens to measure. Two lines and a date read as one block or as
     three things depending almost entirely on this gap. */
  .secret-in{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.4cqw;
    transform:translateY(-4.6cqw);
  }

  /* Covered, not hidden. These were held at opacity 0 until the 12% threshold,
     which meant the gold came away over bare paper and then the whole message
     arrived at once — after the work was already done, and by something other
     than the work. They are simply here now, under the plate, and scratching
     uncovers them the way scratching uncovers anything.

     The clip on .secret is what makes that safe; see there. */
  .secret .line,
  .secret .date{
    margin:0;
    text-shadow:0 1px 0 rgba(255,255,255,.55);
  }

  /* Both used to arrive on --ink, which made the sentence and the answer to it
     the same voice. The date is the one thing anyone is here to read, so it
     takes the darker end and the lead-in steps back off it — the size difference
     was already there, and this is the same hierarchy said in tone. */
  .secret .line{
    color:#867e6d;
    font-style:italic;
    font-size:3.7cqw;
    line-height:1.44;
    letter-spacing:.006em;
    text-wrap:balance;
  }

  .secret .date{
    color:#463f33;
    font-size:5.6cqw;
    font-weight:600;          /* a shade heavier than the line above it */
    letter-spacing:.16em;
    /* No text-indent, and nothing in its place. It was there to answer the
       trailing letter-space — the one added after the last glyph as well as
       between them — but a max-content box does not include that space, so
       there was nothing to answer and the indent was simply
       .25em of padding on one side. It measured as 3.2px of the date hanging
       right of the heart's centre at 1280x900. Removed, the box is the ink and
       centring one centres the other. */
    font-variant-numeric:tabular-nums lining-nums;
    white-space:nowrap;
  }

  #foil{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    cursor:grab;
    touch-action:none;
    z-index:3;
    transition:opacity .22s linear;
  }
  #foil:active{ cursor:grabbing; }
  #foil:focus-visible{ outline:2px solid #8a7a4a; outline-offset:3px; }
  .revealed #foil{ pointer-events:none; }

  /* Confetti lives above everything, unclipped by the card. Absolute and sized
     to the document in JS, not fixed to the viewport: inside an embedded frame
     `fixed` only ever covers one viewport band, which leaves the rest of the
     page bare no matter how much is thrown. */
  #fx{
    position:absolute;
    top:0;
    left:0;
    pointer-events:none;
    z-index:50;
  }

  /* ---------- below the card ---------- */

  /* Only ever as tall as what is actually being shown in it — which before the
     reveal is nothing at all, now that the hint has gone up onto the card. The
     106px the buttons will eventually need was being held open under the card
     for the whole first half of the page.

     A definite height rather than a floor, because the buttons are hidden with
     opacity and are therefore still in the layout: a floor would be raised to
     their height immediately and nothing would be freed. At zero they overflow
     the band instead, which costs nothing — they are invisible and untouchable
     until the class that opens the band arrives with them. */
  .below{
    display:grid;
    place-items:center;
    width:100%;
    height:0;
  }
  .card.revealed ~ .below{ height:112px; }
  /* hint and buttons share one centred cell, so nothing shifts on reveal */
  .below > *{ grid-area:1 / 1; }

  /* On the card now, under the colophon, so it is printed on the same sheet as
     the line it follows rather than floating on the backdrop below it. Darker
     than --hint either way: it is the only instruction on the page and it was
     disappearing into whatever it sat on. */
  .hint{
    margin:0;
    /* against the card now that it is printed on it, or a fixed 12px on a 330px
       sheet sets nearly as wide as the colophon it is supposed to sit under */
    font-size:clamp(10px, 2.6cqw, 12px);
    letter-spacing:.22em;
    text-indent:.22em;
    text-transform:uppercase;
    color:#6f6857;
    opacity:0;
    transition:opacity .5s ease;
  }
  .hint.show{ opacity:1; }
  .hint.gone{ opacity:0; }

  /* Held back a full second after the reveal, then floated up. The date has to
     land on its own first — arriving with it would make the calendar button
     part of the surprise instead of what you do about it. */
  .after{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    opacity:0;
    transform:translateY(22px);
    transition:opacity .62s var(--ease) 1s, transform .62s var(--ease) 1s;
    pointer-events:none;
  }
  .after.show{ opacity:1; transform:none; pointer-events:auto; }

  /* the same stock and the same press as the invitation above it */
  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    padding:0 clamp(28px,8vw,44px);
    font:inherit;
    font-size:12.5px;
    letter-spacing:.2em;
    text-indent:.2em;
    text-transform:uppercase;
    color:#7d6c3f;
    text-decoration:none;
    background:linear-gradient(174deg,#fdfcf8 0%,#f4f0e6 52%,#eae4d5 100%);
    border:1px solid rgba(150,132,84,.46);
    border-radius:2px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 -1px 0 rgba(120,104,68,.10) inset,
      0 1px 1px rgba(70,62,44,.10),
      0 6px 14px -12px rgba(70,62,44,.5);
    transition:
      color .28s var(--ease), border-color .28s var(--ease),
      box-shadow .28s var(--ease), transform .28s var(--ease);
  }
  /* inner rule, echoing the blind emboss on the card */
  .btn::after{
    content:"";
    position:absolute;
    inset:4px;
    border:1px solid rgba(168,148,96,.28);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
    pointer-events:none;
  }
  .btn:hover{
    color:#6d5c2c;
    border-color:rgba(201,162,39,.75);
    transform:translateY(-1px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 -1px 0 rgba(120,104,68,.12) inset,
      0 2px 2px rgba(70,62,44,.11),
      0 12px 22px -14px rgba(70,62,44,.55);
  }
  .btn:active{
    transform:translateY(0);
    box-shadow:
      0 1px 3px rgba(90,78,48,.24) inset,
      0 1px 0 rgba(255,255,255,.6);
  }

  .again{
    font:inherit;
    font-size:11.5px;
    letter-spacing:.2em;
    text-indent:.2em;
    text-transform:uppercase;
    color:var(--hint);
    background:none;
    border:0;
    padding:9px 12px;
    cursor:pointer;
    border-bottom:1px solid transparent;
    transition:color .25s ease, border-color .25s ease;
  }
  .again:hover{ color:#8a7c58; border-bottom-color:rgba(138,124,88,.45); }

  .btn:focus-visible,
  .again:focus-visible{ outline:2px solid #8a7a4a; outline-offset:3px; }

  @media (max-width:430px){
    .btn{ width:min(300px,78vw); }
  }

  /* ---------- the envelope ---------- */

  /* Edge to edge: the screen is the envelope, rather than a picture of one
     sitting on a table. Three fixed layers with the card between them —

       .envelope   the back of the envelope, and the whole backdrop   z 78
       .card       the real one, seated in the pocket by transform    z 79
       .env-fore   the pocket front, the flap and the seal            z 81

     The card is not a copy and there is no cross-fade. It is the page's own
     card, transformed down into the pocket while sealed and released to its
     resting place on opening, so the thing that comes out of the envelope is
     the thing you then scratch. */

  body.sealed .below,
  body.sealed .sound{ opacity:0; pointer-events:none; }

  /* Held for as long as the envelope exists, not for as long as it is closed.
     This lived on `body.sealed`, which comes off the moment the card is released
     — so the card lost its place in the sandwich at precisely the instant it
     began to move, and spent the rest of the animation behind the back panel.
     It never was clipping. It was falling out from between the layers. */
  body.staging .card{ position:relative; z-index:79; }

  /* The settle belongs to a card that arrives on its own. This one is carried
     out of an envelope, and the journey is the arrival. */
  body.sealed .card,
  body.handed .card{ animation:none; }
  .below{ transition:opacity .9s var(--ease) .5s, height 1.6s var(--ease-paper) 1s; }

  /* The envelope falls, and it goes last.

     It used to leave first and quickest, which made a hard edge travel down
     across a card that was barely moving — and an edge crossing a still object
     is read as a wipe, not as an object departing. So the card is well into its
     climb before this starts, and when it does start it accelerates the whole
     way out, the way a dropped thing does. The slight rotation is what stops it
     looking like a shutter: nothing that falls stays perfectly square. */
  .envelope,
  .env-fore{
    position:fixed;
    inset:0;
    transition:transform 1.15s cubic-bezier(.4,0,.85,.6);
  }
  .envelope{ z-index:78; }
  .env-fore{
    z-index:81;
    background:none;
  }

  /* Fixed, and never given `raised`. Everything else in the envelope leaves
     downward; this one has already left upward and must be allowed to stay
     gone. */
  .env-flap-layer{
    position:fixed;
    inset:0;
    z-index:82;
    perspective:1600px;
    pointer-events:none;
  }

  .envelope.gone,
  .env-fore.gone,
  .env-flap-layer.gone{ display:none; }

  /* Both halves leave downward, together, as one envelope */
  .envelope.raised,
  .env-fore.raised{ transform:translateY(112%) rotate(1.6deg); }

  /* One sheet of paper, cut into three. Each panel paints the same gradient at
     the size of the window and anchored to its top-left, so the tones run
     straight through a seam instead of restarting at it — which is what made
     the flap look like a different piece of paper: it was compressing the whole
     gradient into the 46% of the height it happens to occupy. */
  .env-back,
  .env-front,
  .env-flap{
    position:absolute;
    background-image:linear-gradient(158deg, var(--env-hi) 0%, var(--env) 46%, var(--env-lo) 100%);
    background-size:100vw 100vh;
    background-position:0 0;
    background-repeat:no-repeat;
  }

  .env-back{ inset:0; }

  /* The pocket, with the two side flaps notched out of its top. Its notch and
     the flap's lower edges are the same two lines — 20% at the sides down to
     50% at the point — because anything else leaves a wedge of daylight between
     them, and behind that wedge is the card. */
  .env-front{
    inset:0;
    clip-path:polygon(0 20%, 50% 50%, 100% 20%, 100% 100%, 0 100%);
    /* A shade under the sheet behind it. The gradient still runs straight
       through the seam — this is a flat offset on top of it, the way a leaf of
       paper lying on another leaf is simply a little further from the light.

       It was .955 against the flap's 1.035, and 8% is not a leaf of paper
       further from the light: it is a second stock. What separates the two
       shapes is the fold, and the fold is drawn by the two shadows below, not by
       the tone. So the tone is down to a little over 2% across the seam, which
       is about what one thickness of paper is worth. */
    /* The shadow its top edge casts is doing real work once it starts to fall:
       an edge with paper-thickness shadow under it passes in front of the card,
       where a hard edge with none of it merely erases. */
    filter:brightness(.988) drop-shadow(0 -3px 9px rgba(70,62,44,.30));
  }

  /* Not a triangle: a triangle drawn from the two top corners crosses the
     pocket's notch instead of meeting it. The flap is the full width down to
     the notch shoulders and only then comes to a point, so the two shapes share
     an edge and the envelope is closed. */
  .env-flap{
    left:0; right:0; top:0;
    height:50%;
    clip-path:polygon(0 0, 100% 0, 100% 40%, 50% 100%, 0 40%);
    transform-origin:top center;
    transform:rotateX(0deg);
    transition:transform 1.5s var(--ease-paper) .15s;
    /* and a shade over it, for the same reason in reverse — but the shadow under
       the fold is what carries that line, so this only has to be enough to say
       which of the two leaves is on top. Pushed any further and the flap stops
       being the same sheet as the pocket. */
    filter:brightness(1.014) drop-shadow(0 4px 7px rgba(70,62,44,.26));
  }
  /* Positive, which is away from the viewer. Negative swings the flap's point
     toward the camera on its way over, and a plane passing near the eye under a
     1600px perspective does not read as a flap opening — it magnifies until it
     is a wall of paper across the whole screen, which is exactly what it did. */
  .env-flap-layer.opening .env-flap{ transform:rotateX(176deg); }

  /* where the card sits while it is still in the envelope. Never painted — it
     exists so the script has a box to measure and put the real card into. */
  .slot{
    position:absolute;
    left:50%;
    bottom:9vh;
    width:min(74vw, 340px);
    aspect-ratio:1 / 1.52;
    transform:translateX(-50%);
    visibility:hidden;
  }

  /* wax: an irregular blob, lit from the same place as everything else, sitting
     on the point of the flap where the fold meets the pocket */
  .seal{
    position:absolute;
    left:50%;
    top:50%;
    width:var(--seal);
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    display:grid;
    place-items:center;
    padding:0;
    cursor:pointer;
    border:0;
    pointer-events:auto;        /* its layer does not take pointers; the wax does */
    border-radius:46% 54% 50% 50% / 53% 47% 52% 48%;
    /* Wax, not a bead. The old version put a small bright specular high on the
       left and ramped a dark bronze to a pale gold across the whole blob, which
       is how you shade a sphere — and it read as one. Wax is nearly flat on top
       with the light broad and low in contrast, and it goes dark at the rim
       where it squeezed out under the stamp. */
    background:
      radial-gradient(130% 120% at 50% 8%, rgba(255,246,206,.5), rgba(255,246,206,0) 52%),
      radial-gradient(96% 96% at 50% 46%, #cba62c 0%, #bd961f 58%, #94711a 88%, #7a5c12 100%);
    box-shadow:
      0 1px 0 rgba(255,247,214,.3) inset,
      0 -3px 7px rgba(60,42,4,.34) inset,
      0 2px 4px rgba(70,54,12,.3),
      0 12px 22px -14px rgba(70,54,12,.5);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    font-size:clamp(13px, 4.2vw, 20px);
    letter-spacing:.04em;
    color:#5a4310;
    text-shadow:0 1px 0 rgba(255,240,190,.5), 0 -1px 1px rgba(52,36,2,.5);
    transition:transform .8s var(--ease-paper), opacity .8s var(--ease-paper), box-shadow .3s var(--ease);
  }
  /* the ring the die leaves inside the rim — the part that says it was pressed
     rather than poured */
  .seal::before{
    content:"";
    position:absolute;
    inset:12%;
    border-radius:inherit;
    border:1px solid rgba(92,68,10,.32);
    box-shadow:0 1px 0 rgba(255,244,198,.26);
    pointer-events:none;
  }
  .seal:hover{ box-shadow:
      0 1px 0 rgba(255,247,214,.6) inset,
      0 -2px 4px rgba(60,42,4,.45) inset,
      0 3px 7px rgba(70,54,12,.44),
      0 14px 26px -12px rgba(70,54,12,.6); }
  .seal:focus-visible{ outline:2px solid #8a7a4a; outline-offset:4px; }
  .env-flap-layer.opening .seal{
    transform:translate(-50%,-50%) scale(1.18) rotate(7deg);
    opacity:0;
    pointer-events:none;
  }

  /* Under the wax, not at the foot of the window. Pinned to the bottom edge it
     was a caption for the whole screen, and the screen is not the thing you tap
     — it sat most of a viewport away from the one thing that is. Placed off the
     seal's own centre and its own radius, so it keeps the same short gap under
     the wax whatever size the wax is. */
  .open-hint{
    position:fixed;
    left:0; right:0;
    top:calc(50% + var(--seal) / 2 + clamp(15px, 3.2vh, 26px));
    z-index:82;
    margin:0;
    text-align:center;
    font-size:12px;
    letter-spacing:.22em;
    text-indent:.22em;
    text-transform:uppercase;
    /* darker than --hint, which is still what the secondary button uses. This
       one has to carry across a whole envelope of paper, and it breathes down to
       .42 opacity for half of every cycle, so its darkest is the only moment it
       is fully legible */
    color:#857d6a;
    animation:breathe-hint 3.4s ease-in-out 1.2s infinite both;
  }
  .env-flap-layer.opening ~ .open-hint{ opacity:0; transition:opacity .45s linear; animation:none; }
  @keyframes breathe-hint{
    0%,100%{ opacity:.42; }
    50%    { opacity:1; }
  }

  /* ---------- the sound chip ---------- */

  /* Top-left, which is the one corner the florals leave empty. Present from the
     moment the page tries to play anything, muted or not: audio that starts on
     its own without a visible way to stop it is the rudest thing a page can do. */
  .sound{
    position:fixed;
    top:calc(12px + env(safe-area-inset-top));
    left:calc(12px + env(safe-area-inset-left));
    z-index:70;
    width:44px; height:44px;
    display:grid;
    place-items:center;
    padding:0;
    color:#8a7c58;
    background:linear-gradient(174deg,#fdfcf8 0%,#f4f0e6 52%,#eae4d5 100%);
    border:1px solid rgba(150,132,84,.42);
    border-radius:50%;
    cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 -1px 0 rgba(120,104,68,.10) inset,
      0 1px 2px rgba(70,62,44,.12);
    transition:color .25s var(--ease), border-color .25s var(--ease), opacity .5s var(--ease);
  }
  .sound[hidden]{ display:none; }
  .sound:hover{ color:#6d5c2c; border-color:rgba(201,162,39,.7); }
  .sound:focus-visible{ outline:2px solid #8a7a4a; outline-offset:3px; }
  .sound svg{ width:20px; height:20px; fill:currentColor; }
  /* one icon or the other, never both */
  .sound .off{ display:none; }
  .sound.muted .on{ display:none; }
  .sound.muted .off{ display:block; }
  .sound.muted{ color:#a9a08a; }

  .sr{
    position:absolute; width:1px; height:1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;
  }

  /* ---------- the phone ---------- */

  /* The card keeps its trim, its shadow and its 1:1.52 at every size. It went
     full-bleed on phones for a while; it came back because the envelope is what
     is edge to edge now, and a card that has to grow into a screen cannot be
     the same object that was just lifted out of a pocket. */
  @media (max-width:699px){
    /* a fingertip is not a cursor */
    .again{ padding:13px 18px; }

    /* On a phone the card is bound by the width of the screen and not by the
       height of it — there is height to spare and no way to spend it, because
       the sheet keeps its 1:1.52. The margin either side is the only room left
       to give it, so it is trimmed to the least that still reads as a margin
       and still has somewhere to put the shadow. */
    body{ padding-inline:10px; }
  }

  @media (prefers-reduced-motion:reduce){
    .card{ animation:none; }
    .revealed .bloom{ animation:none; }
    *{ transition-duration:.01ms !important; }
  }
</style>

<!-- The back of the envelope, and the slot the card is seated into. The card
     itself is not in here — it is the page's own, sandwiched between this and
     the pocket by stacking order alone, so that what rises out of the envelope
     is the card and not a picture of one. -->
<div class="envelope" id="envelope">
  <div class="env-back stock"></div>
  <div class="slot" id="slot" aria-hidden="true"></div>
</div>

<div class="env-fore" id="envFore">
  <div class="env-front stock"></div>
</div>

<!-- The flap is on its own layer because it is the one part of the envelope
     that must not travel with the rest. Opened, it lies above the top of the
     screen; carried down by the envelope's exit it comes straight back across
     the card, which is precisely what it was doing.

     The seal rides with it, above it, because wax sits on the outside of a flap
     and not under it. -->
<div class="env-flap-layer" id="envFlap">
  <div class="env-flap stock" aria-hidden="true"></div>
  <button class="seal" id="seal" type="button" aria-label="Open the envelope">M &amp; A</button>
</div>
<p class="open-hint" id="openHint">Tap to open</p>

<audio id="music" src="music.m4a" loop preload="auto"></audio>

<button class="sound" id="sound" type="button" hidden aria-pressed="true" aria-label="Mute the music">
  <svg class="on" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z"/>
    <path d="M16.4 12a4.4 4.4 0 0 0-2.4-3.9v7.8a4.4 4.4 0 0 0 2.4-3.9z"/>
    <path d="M14 2.2v2.1a7.8 7.8 0 0 1 0 15.4v2.1a9.9 9.9 0 0 0 0-19.6z"/>
  </svg>
  <svg class="off" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z"/>
    <path d="M15.6 9.4a.9.9 0 0 1 1.3 0l1.3 1.3 1.3-1.3a.9.9 0 1 1 1.3 1.3L19.5 12l1.3 1.3a.9.9 0 1 1-1.3 1.3l-1.3-1.3-1.3 1.3a.9.9 0 1 1-1.3-1.3L16.9 12l-1.3-1.3a.9.9 0 0 1 0-1.3z"/>
  </svg>
</button>

<main class="card stock" id="card">
  <!-- ornament first, fibre and vignette over it: the same grain and the same
       light fall across the florals as across the rest of the sheet -->
  <div class="corner corner-tr" aria-hidden="true"></div>
  <div class="corner corner-bl" aria-hidden="true"></div>
  <div class="vignette"></div>

  <div class="stack">
    <h1 class="names deboss">Misbah &amp; Areeb</h1>

    <div class="heart">
      <div class="bloom"></div>
      <!-- Raised, not pressed: the light comes from above, so the wall that
           faces up is lit and the one that faces down is in shadow — the
           reverse of the blind deboss on the names and the rule. Shallow on
           purpose; a real blind emboss is a millimetre of paper, and anything
           deeper stops reading as stock and starts reading as a graphic. -->
      <svg class="imprint" id="imprint" viewBox="0 0 100 94" aria-hidden="true">
        <defs>
          <linearGradient id="ip-lift" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#ffffff" stop-opacity=".30"/>
            <stop offset=".54" stop-color="#ffffff" stop-opacity=".05"/>
            <stop offset="1"   stop-color="#6f6449" stop-opacity=".09"/>
          </linearGradient>
          <!-- the same outline again, in unit coordinates, so .secret can be
               clipped to the exact shape of the gold that is covering it -->
          <clipPath id="heart-clip" clipPathUnits="objectBoundingBox">
            <path id="ip-clip"/>
          </clipPath>
        </defs>
        <path id="ip-face"  fill="url(#ip-lift)" stroke="none"/>
        <path id="ip-light" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="1.5" transform="translate(0,-0.8)"/>
        <path id="ip-dark"  fill="none" stroke="rgba(122,111,84,.45)" stroke-width="1.5" transform="translate(0,0.9)"/>
        <path id="ip-foil"  fill="none" stroke="rgba(201,162,39,.62)" stroke-width=".8"/>
      </svg>

      <!-- two elements, because the clip and the optical lift cannot live on the
           same one: clip-path is applied in the element's own coordinates and
           then transformed along with it, so a .secret that carries both would
           move its own clip by exactly as much as it moved the text, and the
           text would never move relative to the shape meant to be holding it -->
      <div class="secret">
        <div class="secret-in">
          <p class="line">invite you to celebrate their wedding on</p>
          <p class="date" id="dateText">10 . 10 . 26</p>
        </div>
      </div>

      <canvas id="foil" role="button" tabindex="0"
              aria-label="Scratch the gold heart to reveal the date. Press Enter to reveal it instead."></canvas>
    </div>

    <div class="colophon">
      <div class="rule deboss" aria-hidden="true"><span></span><b></b><span></span></div>
      <p class="eyebrow deboss">Save <i>the</i> Date</p>
      <!-- The instruction belongs with the thing it is about. Below the card it
           was a caption for the page, a hundred-odd pixels of blank sheet away
           from the last line of the invitation and reading as neither. -->
      <p class="hint" id="hint">Scratch the heart</p>
    </div>
  </div>
</main>

<div class="below">
  <div class="after" id="after">
    <a class="btn" id="ics" download="misbah-areeb-save-the-date.ics" href="#">Add to Calendar</a>
    <button class="again" id="again" type="button">Scratch again</button>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<p class="sr" id="live" role="status" aria-live="polite"></p>

<script>
(() => {
  // ---- the one thing to edit -------------------------------------------
  const EVENT = {
    date:  '2026-10-10',            // ISO, drives the .ics
    shown: '10 . 10 . 26',          // how it reads on the card
    title: 'Misbah & Areeb — Wedding',
  };

  // Set to a real .ics path when this page is hosted (see the calendar section
  // at the foot of this file). Empty means "build one in the browser".
  const ICS_URL = 'save-the-date.ics';
  // ----------------------------------------------------------------------

  function buildIcs(){
    const d = EVENT.date.replace(/-/g, '');
    const next = new Date(EVENT.date + 'T00:00:00Z');
    next.setUTCDate(next.getUTCDate() + 1);
    const end = next.toISOString().slice(0, 10).replace(/-/g, '');
    return [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//save the date//EN',
      'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + d + '-misbah-areeb@savethedate',
      'DTSTAMP:' + d + 'T000000Z',
      'DTSTART;VALUE=DATE:' + d,
      'DTEND;VALUE=DATE:' + end,
      'SUMMARY:' + EVENT.title,
      'DESCRIPTION:Save the date. Invitation to follow.',
      'TRANSP:TRANSPARENT',
      'END:VEVENT', 'END:VCALENDAR',
    ].join('\r\n');
  }
  // ----------------------------------------------------------------------

  const card   = document.getElementById('card');
  const foil   = document.getElementById('foil');
  const fx     = document.getElementById('fx');
  const hint   = document.getElementById('hint');
  const after  = document.getElementById('after');
  const live   = document.getElementById('live');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.getElementById('dateText').textContent = EVENT.shown;

  const fctx = foil.getContext('2d', { willReadFrequently: true });
  const xctx = fx.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  let VW = 0, VH = 0;
  let plate = null;          // pristine foil, drawn once, reused on reset
  let opaqueAtStart = 0;
  let scratching = false, touched = false, revealed = false;
  let last = null, sinceCheck = 0;

  const GOLD     = ['#fff7d6','#f6e39a','#e0c359','#c9a227','#a8811b','#7e5f12'];
  const CONFETTI = ['#fff3c4','#f6e39a','#e0c359','#c9a227','#a8811b',
                    '#ffffff','#ffffff','#fdfbf3','#f4f0e4'];
  const WHITES   = new Set(['#ffffff','#fdfbf3','#f4f0e4']);

  const CLEAR_AT = .12;      // fraction of foil left before the card lets go

  /* ---------- geometry ---------- */

  // Parametric heart. Returns points in a 32 x 29 unit box, centred.
  function heartPoints(cx, cy, halfW, scale, step){
    const pts = [];
    for (let t = 0; t <= Math.PI * 2 + .0001; t += step){
      const x = 16 * Math.sin(t) ** 3;
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      pts.push([cx + x * (halfW / 16), cy - (y + 2.5) * (halfW / 16) * scale]);
    }
    return pts;
  }

  function heartPath(ctx, cx, cy, halfW, scale){
    const pts = heartPoints(cx, cy, halfW, scale, .012);
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
  }

  // A hair inside the box on every side. Fitted flush, the widest point of each
  // lobe lands exactly on the first and last pixel column of the canvas and is
  // cut flat there — which does not read as a heart that fills its box, it reads
  // as a heart clipped by something. Applied to the width and the height by the
  // same factor, so the silhouette keeps its proportion and only its margin
  // changes.
  const INSET = .965;

  const geom = () => {
    const halfW = W * 0.5 * INSET;
    return { cx: W / 2, cy: H / 2, halfW, scale: (H / 2 * INSET) / (14.5 * (halfW / 16)) };
  };

  // the SVG imprint uses a fixed 100 x 94 viewBox, so it only has to be built
  // once — off the same INSET, or the outline left behind on the reveal would
  // not be the same heart as the gold that was scratched off it
  (() => {
    const halfW = 50 * INSET;
    const scale = (47 * INSET) / (14.5 * (halfW / 16));
    const d = heartPoints(50, 47, halfW, scale, .03)
      .map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2))
      .join(' ') + ' Z';
    for (const id of ['ip-face', 'ip-dark', 'ip-light', 'ip-foil'])
      document.getElementById(id).setAttribute('d', d);

    // and once more in a unit box, for the clip. Same construction, W = H = 1,
    // so the clip is the plate's own silhouette however large the plate is.
    const hw = .5 * INSET, sc = (.5 * INSET) / (14.5 * (hw / 16));
    document.getElementById('ip-clip').setAttribute('d',
      heartPoints(.5, .5, hw, sc, .03)
        .map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(5) + ' ' + y.toFixed(5))
        .join(' ') + ' Z');
  })();

  /* ---------- the foil plate ---------- */

  // The photographed glitter, clipped to the heart, and nothing else. What used
  // to be here — a two-scale crumple light-map, brushed grain, micro-grain, a
  // rolled-metal sweep, catchlights, painted specks, a bevel and a pressed rim —
  // was all one argument: that drawn gold is metal. A photograph of metal does
  // not have to make it.
  let foilTex = null;
  (() => {
    const img = new Image();
    img.onload = () => {
      foilTex = img;
      if (!W || !H) return;
      buildPlate();
      // a plate already scratched into is left alone: rebuilding it mid-scratch
      // would fill the holes back in
      if (!touched && !revealed) paintPlate();
    };
    img.src = 'foil.jpg';
  })();

  function buildPlate(){
    const g = geom();
    plate = document.createElement('canvas');
    plate.width = foil.width; plate.height = foil.height;
    const c = plate.getContext('2d');
    c.scale(dpr, dpr);

    c.save();
    heartPath(c, g.cx, g.cy, g.halfW, g.scale);
    c.clip();

    if (foilTex){
      // cover, so the grain keeps its proportions whatever shape it is poured into
      const s = Math.max(W / foilTex.naturalWidth, H / foilTex.naturalHeight);
      const w = foilTex.naturalWidth * s, h = foilTex.naturalHeight * s;
      c.drawImage(foilTex, (W - w) / 2, (H - h) / 2, w, h);
    } else {
      // until the photograph arrives, and for good if it never does
      const base = c.createLinearGradient(0, 0, W, H);
      base.addColorStop(0,   '#eed291');
      base.addColorStop(.40, '#ac8730');
      base.addColorStop(.58, '#e2cb8a');
      base.addColorStop(1,   '#8e6d26');
      c.fillStyle = base;
      c.fillRect(0, 0, W, H);
    }

    c.restore();
  }

  function paintPlate(){
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.clearRect(0, 0, foil.width, foil.height);
    fctx.drawImage(plate, 0, 0);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Sampled coarsely on purpose: this runs mid-drag on a phone, and reading
  // every pixel of the heart between finger moves is what makes a scratch feel
  // sticky. Every 24th pixel is plenty to judge a 12% threshold.
  function countOpaque(){
    const d = fctx.getImageData(0, 0, foil.width, foil.height).data;
    let n = 0;
    for (let i = 3; i < d.length; i += 4 * 24) if (d[i] > 24) n++;
    return n;
  }

  /* ---------- sizing ---------- */

  // offsetWidth, not getBoundingClientRect: while the card is still seated in
  // the envelope it carries a scale, and the rect reports what that scale makes
  // it look like. Building the plate at that size and then releasing the card to
  // full size would hand back a soft, upscaled heart. The layout box is the same
  // either way, and it is the one the plate has to match.
  function resizeFoil(){
    if (!foil.offsetWidth) return;
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = foil.offsetWidth; H = foil.offsetHeight;
    foil.width  = Math.round(W * dpr);
    foil.height = Math.round(H * dpr);

    buildPlate();
    if (!revealed){
      paintPlate();
      opaqueAtStart = countOpaque();
    } else {
      fctx.setTransform(1, 0, 0, 1, 0, 0);
      fctx.clearRect(0, 0, foil.width, foil.height);
      fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  function resizeFx(){
    const doc = document.documentElement;
    // measure with the canvas collapsed, or it counts toward its own height
    fx.style.height = '0px';
    const w = Math.max(doc.clientWidth || 0, innerWidth || 0);
    const h = Math.max(
      doc.clientHeight || 0, innerHeight || 0,
      doc.scrollHeight || 0, document.body ? document.body.scrollHeight : 0
    );
    if (w === VW && h === VH && fx.width){ fx.style.height = VH + 'px'; return; }

    VW = w; VH = h;
    const r = Math.min(devicePixelRatio || 1, 2);
    fx.style.width  = VW + 'px';
    fx.style.height = VH + 'px';
    fx.width  = Math.round(VW * r);
    fx.height = Math.round(VH * r);
    xctx.setTransform(fx.width / VW, 0, 0, fx.height / VH, 0, 0);
  }

  // element box in page coordinates — the canvas spans the document, not the
  // viewport, so anything aimed at the heart has to add the scroll offset
  function pageRect(el){
    const r = el.getBoundingClientRect();
    return { left: r.left + scrollX, top: r.top + scrollY, width: r.width, height: r.height };
  }

  // heart-local point -> page point
  function toViewport(x, y){
    const r = pageRect(foil);
    return { x: r.left + x, y: r.top + y };
  }

  /* ---------- idle shimmer, until first contact ---------- */

  let shimmerStart = null, shimmerId = 0;

  function shimmer(ts){
    if (touched || revealed) return;
    if (shimmerStart === null) shimmerStart = ts;
    const cycle = 4200;
    const p = ((ts - shimmerStart) % cycle) / cycle;

    paintPlate();
    if (p < .62){
      const t = p / .62;
      const x = -W * .7 + t * (W * 2.4);
      const g = fctx.createLinearGradient(x - W * .3, -H * .2, x + W * .3, H * 1.2);
      g.addColorStop(0,  'rgba(255,255,255,0)');
      g.addColorStop(.5, 'rgba(255,255,255,.42)');
      g.addColorStop(1,  'rgba(255,255,255,0)');
      fctx.save();
      fctx.globalCompositeOperation = 'source-atop';
      fctx.fillStyle = g;
      fctx.fillRect(0, 0, W, H);
      fctx.restore();
    }
    shimmerId = requestAnimationFrame(shimmer);
  }

  /* ---------- scratching ---------- */

  function scratchTo(x, y){
    fctx.globalCompositeOperation = 'destination-out';
    const r = Math.max(13, W * 0.085);

    const stamp = (px, py) => {
      const g = fctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0,   'rgba(0,0,0,1)');
      g.addColorStop(.55, 'rgba(0,0,0,.92)');
      g.addColorStop(1,   'rgba(0,0,0,0)');
      fctx.fillStyle = g;
      fctx.beginPath(); fctx.arc(px, py, r, 0, 6.283); fctx.fill();
    };

    if (last){
      const dx = x - last.x, dy = y - last.y;
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (r * .34)));
      for (let i = 1; i <= steps; i++) stamp(last.x + dx * i / steps, last.y + dy * i / steps);
      if (!reduce) crumbs(x, y, Math.min(4, 1 + (Math.hypot(dx, dy) / 12) | 0));
    } else {
      stamp(x, y);
    }
    fctx.globalCompositeOperation = 'source-over';
    last = { x, y };
  }

  const local = e => {
    const r = foil.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  const cleared = () => opaqueAtStart && countOpaque() / opaqueAtStart < CLEAR_AT;

  foil.addEventListener('pointerdown', e => {
    if (revealed) return;
    firstTouch();
    scratching = true;
    last = null;
    foil.setPointerCapture(e.pointerId);
    const p = local(e);
    scratchTo(p.x, p.y);
  });

  foil.addEventListener('pointermove', e => {
    if (!scratching || revealed) return;
    e.preventDefault();
    const p = local(e);
    scratchTo(p.x, p.y);

    if (++sinceCheck > 5){
      sinceCheck = 0;
      if (cleared()) reveal();
    }
  }, { passive: false });

  const stop = () => {
    scratching = false; last = null; sinceCheck = 0;
    // catch a finish that lands between move-samples
    if (!revealed && cleared()) reveal();
  };
  foil.addEventListener('pointerup', stop);
  foil.addEventListener('pointercancel', stop);
  foil.addEventListener('lostpointercapture', stop);

  foil.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); firstTouch(); reveal(); }
  });

  function firstTouch(){
    if (touched) return;
    touched = true;
    cancelAnimationFrame(shimmerId);
    paintPlate();
    hint.classList.add('gone');
  }

  /* ---------- particles ---------- */

  const parts = [];
  let fxRunning = false;

  // The show is sized to the page, off both dimensions. Keying any of this to
  // width alone collapses the whole effect on a tall phone, where the window is
  // narrow but there is a great deal of height to fill.
  function fxScale(){
    const diag = Math.hypot(VW, VH);
    const area = (VW * VH) / 630000;            // 900 x 700 reference window
    return {
      k:  Math.min(2.4, Math.max(.9,   diag / 900)),         // how far it throws
      sz: Math.min(2.0, Math.max(1.05, diag / 950)),         // piece size
      n:  Math.min(2.4, Math.max(1.15, Math.sqrt(area))),    // piece count
    };
  }

  // A phone repainting a thousand tumbling rectangles drops frames, and a
  // dropped frame in a two-second flourish is the whole flourish.
  const MAX_PARTS = 820;

  function fleck(x, y, vx, vy, s){
    if (parts.length >= MAX_PARTS) parts.shift();
    const c = CONFETTI[(Math.random() * CONFETTI.length) | 0];
    parts.push({
      x, y, vx, vy,
      w: (3 + Math.random() * 6.5) * s.sz,
      h: (2 + Math.random() * 4.5) * s.sz,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .34,
      // Paper falls at a terminal speed, it does not accelerate forever. Damping
      // the vertical against gravity is what keeps the window full instead of
      // dumping everything past the bottom edge a second after the pop.
      g: .12 * s.sz,
      damp: .94 + Math.random() * .02,   // terminal ≈ 2–3 px/frame, times sz
      drag: .985,                        // horizontal only
      sway: (.4 + Math.random() * 1.1) * s.sz,
      life: 1, decay: .0012 + Math.random() * .0018,
      c, light: WHITES.has(c),
    });
  }

  // foil coming off under the fingertip — stays small, it is debris not confetti
  function crumbs(x, y, n){
    const v = toViewport(x, y);
    for (let i = 0; i < n; i++){
      parts.push({
        x: v.x, y: v.y,
        vx: (Math.random() - .5) * 1.6,
        vy: -Math.random() * 1.1,
        w: .8 + Math.random() * 1.9,
        h: .8 + Math.random() * 1.9,
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
        g: .14, drag: .99, damp: 1, sway: 0,
        life: 1, decay: .016 + Math.random() * .016,
        c: GOLD[(Math.random() * GOLD.length) | 0],
      });
    }
    runFx();
  }

  // celebration out of the heart, in viewport space so it clears the card
  function burst(n, power, lift, spreadX){
    const s = fxScale();
    const r = pageRect(foil);
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const count = Math.round(n * s.n);
    for (let i = 0; i < count; i++){
      const a = Math.random() * 6.283;
      // sqrt keeps the speeds area-uniform, so the pop fills a disc instead of
      // travelling as a ring with a hole in the middle
      const v = power * s.k * (.18 + Math.sqrt(Math.random()) * .82);
      fleck(
        cx + Math.cos(a) * r.width  * .3,
        cy + Math.sin(a) * r.height * .3,
        Math.cos(a) * v * spreadX,
        Math.sin(a) * v - lift * s.k,
        s
      );
    }
    runFx();
  }

  // Side cannons, so the far edges of the window get their share. Origins are
  // smeared along the bottom edge — fired from a single point they arrive as one
  // clump instead of a spray.
  function cannon(dir){                       // -1 fires from the left, 1 from the right
    const s = fxScale();
    const count = Math.round(46 * s.n);
    for (let i = 0; i < count; i++){
      const a = -1.24 + Math.random() * 1.0;  // 71deg to 14deg above the horizon
      const v = (7 + Math.random() * 13) * s.k;
      const off = Math.random() * VW * .34;
      fleck(
        dir < 0 ? -14 + off : VW + 14 - off,
        VH * (.72 + Math.random() * .3),
        Math.cos(a) * v * -dir,
        Math.sin(a) * v,
        s
      );
    }
    runFx();
  }

  // Pieces seeded across the whole window rather than thrown from one place. A
  // point emitter always reads as a ring expanding off the card no matter how
  // hard it throws; this is what actually fills the screen.
  function storm(n){
    const s = fxScale();
    const count = Math.round(n * s.n);
    for (let i = 0; i < count; i++){
      fleck(
        Math.random() * VW,
        -VH * .12 + Math.random() * VH * 1.05,   // the whole page, top to bottom
        (Math.random() - .5) * 7 * s.k,
        -2 + Math.random() * 6,
        s
      );
    }
    runFx();
  }

  // the curtain: pieces coming down from just above the fold, full width
  function fall(n){
    const s = fxScale();
    const count = Math.round(n * s.n);
    for (let i = 0; i < count; i++){
      fleck(
        Math.random() * VW,
        -20 - Math.random() * VH * .3,
        (Math.random() - .5) * 3.2,
        1 + Math.random() * 2.4,
        s
      );
    }
    runFx();
  }

  // Timed so the window is never empty: the pop and the cannons throw pieces
  // outward, and by the time those are on their way down a curtain is already
  // coming in from above the fold to fill the space they left.
  function confetti(){
    if (reduce) return;
    const later = (ms, fn) => setTimeout(() => { if (revealed) fn(); }, ms);

    burst(120, 8, 10, 1.35);                             // the pop, at the heart
    later(90,  () => storm(80));                         // the page fills
    later(150, () => cannon(-1));
    later(220, () => cannon(1));
    later(380, () => storm(60));
    later(430, () => burst(45, 5, 14, .7));              // the drift
    [560, 980, 1450, 1950, 2500, 3100, 3700, 4300]       // the curtain
      .forEach((t, i) => later(t, () => fall(i < 2 ? 42 : 30)));
  }

  function runFx(){
    if (fxRunning) return;
    fxRunning = true;
    requestAnimationFrame(tick);
  }

  function tick(){
    xctx.clearRect(0, 0, VW, VH);
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.vy = (p.vy + p.g) * p.damp;
      p.vx *= p.drag;
      p.rot += p.vr;
      p.x += p.vx + Math.sin(p.rot) * p.sway;
      p.y += p.vy;
      p.life -= p.decay;
      // pieces above the fold are still in play; only the gone ones are dropped
      if (p.life <= 0 || p.y > VH + 60 || p.x < -120 || p.x > VW + 120){
        parts.splice(i, 1);
        continue;
      }

      // flip-flatten as it tumbles, so flakes read as foil not squares
      const h = p.h * Math.abs(Math.cos(p.rot));
      xctx.save();
      xctx.translate(p.x, p.y);
      xctx.rotate(p.rot * .5);
      xctx.globalAlpha = Math.min(1, p.life * 2.2);
      xctx.fillStyle = p.c;
      xctx.fillRect(-p.w / 2, -h / 2, p.w, h);
      if (p.light){
        // white on a pale ground needs an edge to exist
        xctx.strokeStyle = 'rgba(140,128,98,.4)';
        xctx.lineWidth = .5;
        xctx.strokeRect(-p.w / 2, -h / 2, p.w, h);
      }
      xctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick);
    else { fxRunning = false; xctx.clearRect(0, 0, VW, VH); }
  }

  /* ---------- reveal ---------- */

  // remaining foil is wiped outward from the centre, shedding as it goes
  function dissolve(){
    const g = geom();
    const maxR = Math.hypot(W, H) * .62;
    const band = W * .26;
    const dur  = 420;
    let t0 = null;

    function step(ts){
      if (t0 === null) t0 = ts;
      const p = Math.min(1, (ts - t0) / dur);
      const r = (1 - Math.pow(1 - p, 3)) * maxR;   // easeOutCubic

      fctx.globalCompositeOperation = 'destination-out';
      const grd = fctx.createRadialGradient(g.cx, g.cy, Math.max(0, r - band), g.cx, g.cy, r);
      grd.addColorStop(0, 'rgba(0,0,0,1)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      fctx.fillStyle = grd;
      fctx.fillRect(0, 0, W, H);
      fctx.globalCompositeOperation = 'source-over';

      if (r < g.halfW * 1.05){
        const a = Math.random() * 6.283;
        crumbs(g.cx + Math.cos(a) * r, g.cy + Math.sin(a) * r * .9, 2);
      }
      if (p < 1) requestAnimationFrame(step);
      else foil.style.opacity = '0';
    }
    requestAnimationFrame(step);
  }

  function reveal(){
    if (revealed) return;
    revealed = true;
    scratching = false;
    card.classList.add('revealed');
    hint.classList.add('gone');
    after.classList.add('show');

    if (reduce){
      fctx.setTransform(1, 0, 0, 1, 0, 0);
      fctx.clearRect(0, 0, foil.width, foil.height);
      fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      foil.style.opacity = '0';
    } else {
      resizeFx();          // measure the page as it is now, then fill it
      dissolve();
      confetti();
    }
    live.textContent = 'Revealed: Misbah and Areeb invite you to celebrate their wedding on ' + EVENT.shown;
  }

  document.getElementById('again').addEventListener('click', () => {
    revealed = false; touched = false; last = null; shimmerStart = null; sinceCheck = 0;
    card.classList.remove('revealed');
    after.classList.remove('show');
    hint.classList.remove('gone');
    parts.length = 0;
    foil.style.opacity = '';
    paintPlate();
    opaqueAtStart = countOpaque();
    if (!reduce) shimmerId = requestAnimationFrame(shimmer);
    foil.focus();
  });

  /* ---------- calendar file ---------- */

  // A real .ics served over http is the only form every phone handles well —
  // iOS opens it straight into Calendar. When this page is hosted somewhere and
  // ICS_URL points at a sibling file, use it. Standing alone with no server, a
  // Blob is the next best thing; a `data:` URI is the one form iOS ignores
  // outright, so it is not used at all.
  (() => {
    const link = document.getElementById('ics');

    if (typeof ICS_URL === 'string' && ICS_URL){
      link.href = ICS_URL;
      return;
    }

    const blob = new Blob([buildIcs()], { type: 'text/calendar;charset=utf-8' });
    link.href = URL.createObjectURL(blob);
  })();

  /* ---------- music ---------- */

  // Asked to start the moment the page opens, which no browser actually allows
  // on a first visit — an unmuted `play()` without a gesture behind it is
  // rejected, and iOS rejects it every time. So: try immediately, and if the
  // promise comes back rejected, wait for the first touch anywhere on the page
  // and try again. That first touch is nearly always the scratch, so the music
  // arrives on its own without the visitor ever being asked to press play.
  (() => {
    const music = document.getElementById('music');
    const chip  = document.getElementById('sound');
    const LEVEL = .62;

    // iOS makes HTMLMediaElement.volume read-only, so a volume fade is silently
    // ignored on exactly the devices this page is opened on most. Routing the
    // element through a gain node is the one way to ramp it there; if any of it
    // is unavailable, fall back to the plain property and let it no-op.
    let ctx = null, gain = null;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC){
        ctx  = new AC();
        gain = ctx.createGain();
        gain.gain.value = 0;
        ctx.createMediaElementSource(music).connect(gain).connect(ctx.destination);
      }
    } catch { ctx = gain = null; }

    if (!gain) music.volume = 0;

    let wanted = true;                     // what the visitor has asked for
    let armed = false;                     // gesture fallback listening?

    const ramp = (to, seconds) => {
      if (gain){
        const t = ctx.currentTime;
        gain.gain.cancelScheduledValues(t);
        gain.gain.setValueAtTime(gain.gain.value, t);
        gain.gain.linearRampToValueAtTime(to, t + seconds);
        return;
      }
      music.volume = to;                   // no-op on iOS, correct everywhere else
    };

    const kick = () => { play(); };

    function arm(){
      if (armed) return;
      armed = true;
      for (const type of ['pointerdown', 'touchstart', 'keydown'])
        addEventListener(type, kick, { passive: true });
    }

    function disarm(){
      if (!armed) return;
      armed = false;
      for (const type of ['pointerdown', 'touchstart', 'keydown'])
        removeEventListener(type, kick);
    }

    // Playing is not the same as audible. A context routed between the element
    // and the speakers starts suspended under the same autoplay policy, and
    // Chrome will happily resolve play() while it stays that way — which is
    // silence with every success signal you could ask for. So the gesture
    // fallback stays armed until the context is actually running.
    function settle(){
      ramp(LEVEL, 1.2);
      if (!ctx || ctx.state === 'running') disarm();
      else arm();
    }

    function play(){
      if (!wanted) return;
      ctx?.resume?.().catch(() => {});
      const p = music.play();
      if (!p || !p.then){ settle(); return; }
      p.then(settle).catch(arm);
    }

    chip.addEventListener('click', () => {
      wanted = !wanted;
      chip.classList.toggle('muted', !wanted);
      chip.setAttribute('aria-pressed', String(wanted));
      chip.setAttribute('aria-label', wanted ? 'Mute the music' : 'Play the music');
      if (wanted){ play(); return; }
      ramp(0, .35);
      disarm();
      setTimeout(() => { if (!wanted) music.pause(); }, 380);
    });

    // A page left open in a background tab should not keep playing into a room
    // nobody is looking at.
    addEventListener('visibilitychange', () => {
      if (document.hidden){ ramp(0, .25); setTimeout(() => music.pause(), 280); }
      else if (wanted && music.paused) play();
    });

    chip.hidden = false;
    play();
  })();

  /* ---------- the envelope ---------- */

  // Nothing here talks to the music: the first tap on the seal is a pointerdown
  // like any other, which is exactly what the audio fallback is already waiting
  // for. The opening gesture pays for the sound without either knowing about
  // the other.
  (() => {
    const wrap = document.getElementById('envelope');
    const fore = document.getElementById('envFore');
    const flap = document.getElementById('envFlap');
    const slot = document.getElementById('slot');
    const seal = document.getElementById('seal');
    let opened = false;

    // Seat the real card in the pocket. Measure it where it belongs, measure the
    // slot, and carry it there with one transform. Both boxes are 1:1.52, so the
    // scale is uniform and nothing inside the card is stretched on the way — the
    // reason the card went back to being a framed card at every size.
    function seat(){
      if (opened) return;
      card.style.transition = 'none';
      card.style.transform = 'none';
      const to = card.getBoundingClientRect();
      const from = slot.getBoundingClientRect();
      if (!to.width || !from.width) return;
      const s = from.width / to.width;
      const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
      const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
      card.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + s + ')';
    }

    // Slow, and overlapping. The flap is still settling when the card starts to
    // move, and the card is still moving when the envelope begins to fall: three
    // events that share their edges read as one event, where three that queue up
    // politely read as a list.
    function open(){
      if (opened) return;
      opened = true;
      fore.classList.add('opening');                 // the seal breaks
      flap.classList.add('opening');                 // and the flap swings back

      // The card goes first, and it is already climbing out of the notch by the
      // time anything else moves. That order is the whole difference: a card
      // that is visibly travelling when the envelope drops is a card being
      // taken out of it, and a card sitting still while an edge crosses it is
      // just an edge crossing it.
      setTimeout(() => {
        card.style.transition = 'transform 1.9s var(--ease-paper)';
        card.style.transform = 'none';
        document.body.classList.add('handed');
        document.body.classList.remove('sealed');
      }, 780);

      setTimeout(() => {
        wrap.classList.add('raised');
        fore.classList.add('raised');
      }, 1450);

      setTimeout(() => { if (!touched) hint.classList.add('show'); }, 3100);
      // the card only leaves the sandwich once there is no sandwich left
      setTimeout(() => {
        wrap.classList.add('gone');
        fore.classList.add('gone');
        flap.classList.add('gone');
        document.body.classList.remove('staging');
        card.style.transition = '';
        card.style.transform = '';
      }, 3000);
    }

    // Someone who has asked for less motion has not asked for less invitation,
    // but they should not have to sit through the flap to get to it.
    if (reduce){
      document.body.classList.add('handed');
      document.body.classList.remove('sealed', 'staging');
      wrap.classList.add('gone');
      fore.classList.add('gone');
      flap.classList.add('gone');
      setTimeout(() => { if (!touched) hint.classList.add('show'); }, 700);
      return;
    }

    seat();
    addEventListener('resize', seat);
    document.fonts?.ready.then(seat, () => {});

    seal.addEventListener('click', open);
    wrap.addEventListener('click', open);
    fore.addEventListener('click', open);
  })();

  /* ---------- boot ---------- */

  // Coalesced, because the card now changes width on the reveal and again on a
  // second scratch: 620ms of resize reports, each of which would rebuild the
  // plate and re-count every 24th pixel of it. One rebuild once the move
  // settles. In between the bitmap simply stretches inside its box, and for the
  // whole of that it is either dissolving or already gone.
  let foilResize = 0;
  new ResizeObserver(() => {
    clearTimeout(foilResize);
    foilResize = setTimeout(resizeFoil, 90);
  }).observe(foil);
  new ResizeObserver(resizeFx).observe(document.documentElement);
  addEventListener('resize', resizeFx);
  addEventListener('orientationchange', resizeFx);
  document.fonts?.ready.then(resizeFx, () => {});
  resizeFx();
  resizeFoil();

  if (!reduce) shimmerId = requestAnimationFrame(shimmer);
})();
</script>

</body>
</html>
